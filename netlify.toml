[build]
  # Build command for Next.js
  command = "npm run build"
  # Directory to publish (Next.js build output)
  publish = ".next"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"
  # Enable Next.js standalone mode for better performance
  NEXT_TELEMETRY_DISABLED = "1"
  # Force Next.js to use standalone build
  NEXT_BUILD_STANDALONE = "true"

# Next.js plugin configuration
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Edge Functions configuration for API routes
[[edge_functions]]
  path = "/api/*"
  function = "api"

# Redirects for Next.js pages and API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Handle Next.js dynamic routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables (these will be set in Netlify UI)
[context.production.environment]
  # Supabase configuration
  NEXT_PUBLIC_SUPABASE_URL = "@supabase_url"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "@supabase_anon_key"
  SUPABASE_SERVICE_ROLE_KEY = "@supabase_service_key"
  
  # OpenAI configuration (if used)
  OPENAI_API_KEY = "@openai_api_key"
  
  # Other environment variables
  NEXTAUTH_SECRET = "@nextauth_secret"
  NEXTAUTH_URL = "@nextauth_url"

[context.deploy-preview.environment]
  # Preview environment variables
  NEXT_PUBLIC_SUPABASE_URL = "@supabase_url_preview"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "@supabase_anon_key_preview"
  SUPABASE_SERVICE_ROLE_KEY = "@supabase_service_key_preview"

[context.branch-deploy.environment]
  # Branch deploy environment variables
  NEXT_PUBLIC_SUPABASE_URL = "@supabase_url_branch"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "@supabase_anon_key_branch"
  SUPABASE_SERVICE_ROLE_KEY = "@supabase_service_key_branch"
